name: OGStarTracker Build CI

on:
  workflow_run:
    workflows: ["Formatting Check"]
    types:
      - completed
    branches:
      - main
      - beta
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio esptool

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Build OGStarTracker ESP32
        run: pio run --project-dir esp32_wireless_control/firmware -e ogstartracker_esp32_release

      - name: Bundle OGStarTracker ESP32 Combined Binary
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cd esp32_wireless_control/firmware/.pio/build/ogstartracker_esp32_release
          produced_bin=$(ls ogstartracker_esp32_*.bin | head -n1)
          cp "$produced_bin" ogstartracker_esp32_${COMMIT_SHA}.bin
          python -m esptool --chip esp32 merge-bin \
            -o ogstartracker_esp32_${COMMIT_SHA}_combined.bin \
            --flash-size 4MB \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 ogstartracker_esp32_${COMMIT_SHA}.bin
          cp ogstartracker_esp32_${COMMIT_SHA}.bin ogstartracker_esp32_${COMMIT_SHA}_combined.bin $GITHUB_WORKSPACE/artifacts/

      - name: Build OGStarTracker ESP32-S3
        run: pio run --project-dir esp32_wireless_control/firmware -e ogstartracker_esp32s3_release

      - name: Bundle OGStarTracker ESP32-S3 Combined Binary
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cd esp32_wireless_control/firmware/.pio/build/ogstartracker_esp32s3_release
          produced_bin=$(ls ogstartracker_esp32s3_*.bin | head -n1)
          cp "$produced_bin" ogstartracker_esp32s3_${COMMIT_SHA}.bin
          python -m esptool --chip esp32s3 merge-bin \
            -o ogstartracker_esp32s3_${COMMIT_SHA}_combined.bin \
            --flash_mode dio \
            --flash_size 4MB \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 ogstartracker_esp32s3_${COMMIT_SHA}.bin
          cp ogstartracker_esp32s3_${COMMIT_SHA}.bin ogstartracker_esp32s3_${COMMIT_SHA}_combined.bin $GITHUB_WORKSPACE/artifacts/

      - name: Upload Build Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: artifacts/*
