name: Create Release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio esptool

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Build OGStarTracker ESP32
        run: pio run --project-dir esp32_wireless_control/firmware -e ogstartracker_esp32_release

      - name: Bundle OGStarTracker ESP32 Combined Binary
        env:
          tag_name: ${{ github.ref_name }}
        run: |
          cd esp32_wireless_control/firmware/.pio/build/ogstartracker_esp32_release
          python -m esptool --chip esp32 merge-bin \
            -o ogstartracker_esp32_${tag_name}_combined.bin \
            --flash-size 4MB \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 ogstartracker_esp32_${tag_name}.bin
          cp ogstartracker_esp32_${tag_name}.bin ogstartracker_esp32_${tag_name}_combined.bin $GITHUB_WORKSPACE/artifacts/

      - name: Build OGStarTracker ESP32-S3
        run: pio run --project-dir esp32_wireless_control/firmware -e ogstartracker_esp32s3_release

      - name: Bundle OGStarTracker ESP32-S3 Combined Binary
        env:
          tag_name: ${{ github.ref_name }}
        run: |
          cd esp32_wireless_control/firmware/.pio/build/ogstartracker_esp32s3_release
          python -m esptool --chip esp32s3 merge-bin \
            -o ogstartracker_esp32s3_${tag_name}_combined.bin \
            --flash_mode dio \
            --flash_size 4MB \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 ogstartracker_esp32s3_${tag_name}.bin
          cp ogstartracker_esp32s3_${tag_name}.bin ogstartracker_esp32s3_${tag_name}_combined.bin $GITHUB_WORKSPACE/artifacts/

      - name: Upload Build Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: artifacts/*

      - name: Create release
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
        run: |
          gh release create "$tag_name" \
            --repo="$GITHUB_REPOSITORY" \
            --title="Release ${tag_name}" \
            --generate-notes
          gh release upload $tag_name artifacts/*
